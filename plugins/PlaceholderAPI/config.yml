# PlaceholderAPI
# Version: 2.11.7
# Created by: extended_clip
# Contributors: https://github.com/PlaceholderAPI/PlaceholderAPI/graphs/contributors
# Issues: https://github.com/PlaceholderAPI/PlaceholderAPI/issues
# Expansions: https://placeholderapi.com/ecloud
# Wiki: https://wiki.placeholderapi.com/
# Discord: https://helpch.at/discord
# No placeholders are provided with this plugin by default.
# Download placeholders: /papi ecloud
check_updates: false
cloud_enabled: true
cloud_sorting: name
boolean:
  'true': 'yes'
  'false': 'no'
date_format: dd.MM.yy HH:mm:ss
debug: false
expansions:
  playerlist:
    update-cooldown: 1000
    offline-text: Offline
    argument-separator: ','
    lists:
      players:
        type: ONLINE
        included: true
        filters:
        - '!PERMISSION:group.staff'
        - CANSEE
      staff:
        type: ONLINE
        included: true
        filters:
        - PERMISSION:group.staff
        - CANSEE
    groups:
      staffAndPlayers:
        gap: 1
        lists:
          staff:
            title: Staff Members (%amount%)
            max: 10
            remaining: '... and %remaining% more!'
          players:
            title: Players (%amount%)
  pinger:
    offline: '&cOffline'
    check_interval: 30
    online: '&aOnline'
  server:
    server_name: A Minecraft Server
    time:
      locale: de-DE
      zone: Etc/UTC
      suffix:
        week: W
        day: T
        hour: S
        minute: M
        second: Sek
    tps_color:
      high: '&a'
      medium: '&e'
      low: '&c'
  player:
    ping_value:
      high: 100
      medium: 50
    direction:
      north: N
      south: S
      north_west: NW
      north_east: NO
      east: O
      south_east: SO
      west: W
      south_west: SW
    ping_color:
      medium: '&e'
      high: '&c'
      low: '&a'
